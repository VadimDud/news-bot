<div class="card">
  <h2>Вход</h2>
  <p class="meta">Введите ваш Telegram ID, чтобы создавать и настраивать ленты. Авторизация через Telegram будет подключена позже.</p>
  <form method="get" action="/channels">
    <label for="user_id">Telegram ID</label>
    <input type="number" id="user_id" name="user_id" required placeholder="Например, 123456789">
    <div class="hint">Узнать свой ID можно через @userinfobot</div>
    <button type="submit">Войти</button>
  </form>
</div>
