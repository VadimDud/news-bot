<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${title}</title>
<style>
:root {
  --bg: #0f1420;
  --panel: #171d2e;
  --border: #262e45;
  --text: #e6e9f2;
  --muted: #9aa3b8;
  --accent: #4f8cff;
  --accent-hover: #3a74e0;
  --danger: #ff5d5d;
  --ok: #3ecf8e;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}
header {
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
header .logo { font-weight: 700; font-size: 18px; }
header a { color: var(--muted); text-decoration: none; margin-left: auto; font-size: 14px; }
header a:hover { color: var(--text); }
main { max-width: 720px; margin: 32px auto; padding: 0 16px; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 16px;
}
.card h2 { margin: 0 0 8px; font-size: 18px; }
.card .meta { color: var(--muted); font-size: 13px; }
label { display: block; margin: 14px 0 6px; font-weight: 600; font-size: 14px; }
input[type=text], input[type=number], textarea {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
}
textarea { resize: vertical; min-height: 90px; }
.hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
.checkbox-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 8px;
  margin-top: 6px;
}
.checkbox-grid label {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  font-weight: 400;
  cursor: pointer;
}
.checkbox-grid input { width: auto; }
button, .btn {
  display: inline-block;
  padding: 10px 18px;
  border-radius: 10px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  margin-top: 16px;
}
button:hover, .btn:hover { background: var(--accent-hover); }
button.secondary, .btn.secondary {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
button.secondary:hover, .btn.secondary:hover { background: var(--border); }
button.danger, .btn.danger { background: var(--danger); }
.actions { display: flex; gap: 8px; margin-top: 12px; }
.actions form { margin: 0; }
.actions .btn, .actions button { margin-top: 0; }
.chip {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(79,140,255,.15);
  color: var(--accent);
  font-size: 12px;
}
.empty { color: var(--muted); text-align: center; padding: 30px 0; }
.notice {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 16px;
  font-size: 14px;
}
.notice.warn { background: rgba(255,165,0,.12); border: 1px solid rgba(255,165,0,.4); color: #ffc45c; }
.notice.error { background: rgba(255,93,93,.12); border: 1px solid var(--danger); color: var(--danger); }
.notice.ok { background: rgba(62,207,142,.12); border: 1px solid var(--ok); color: var(--ok); }
code {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1px 6px;
  font-size: 13px;
}
</style>
</head>
<body>
<header>
  <span class="logo">📡 Tech News Bot</span>
  <a href="/">Сменить пользователя</a>
</header>
<main>
${content}
</main>
</body>
</html>
