services:
  moex-trader:
    build: ./trading_moex
    container_name: moex-trader
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TRADER_DRY_RUN: "${TRADER_DRY_RUN:-true}"
      TRADER_POLL_INTERVAL: "${TRADER_POLL_INTERVAL:-60}"
      TRADER_WATCH_TICKERS: "${TRADER_WATCH_TICKERS:-SBER,LKOH}"
      TRADER_WEB_PORT: "${TRADER_WEB_PORT:-8081}"
      TRADER_WEB_PASSWORD: "${TRADER_WEB_PASSWORD:-}"
      TRADER_QUANTITY: "${TRADER_QUANTITY:-1}"
      TRADER_LIVE_INTERVAL: "${TRADER_LIVE_INTERVAL:-hour}"
      TINKOFF_API_TOKEN: "${TINKOFF_API_TOKEN:-}"
      TINKOFF_SSL_RU_CA: "${TINKOFF_SSL_RU_CA:-true}"
      MOEX_LOGIN: "${MOEX_LOGIN:-}"
      MOEX_PASSWORD: "${MOEX_PASSWORD:-}"
      # Переопределяем HTTP_PROXY из .env: контейнер в bridge-сети, адрес
      # 127.0.0.1:31533 там недоступен, а MOEX/ЦБ блокировками не затронуты.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
    ports:
      - "8081:8081"
    volumes:
      # Именованный volume: при первом запуске Docker копирует /app/data из
      # образа вместе с правами владельца (botuser), в отличие от bind-mount,
      # который создаётся с root-правами и ломает SQLite.
      - trader-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    container_name: tech-news-bot
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./dbdata:/app/dbdata
      - /home/vadman1/.config/opencode:/home/botuser/.config/opencode:ro
      - ./config/opencode/agent:/home/botuser/.config/opencode/agent:ro
      - ./dbdata/opencode_sessions:/home/botuser/.local/share/opencode
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('/app/dbdata/bot.db').execute('SELECT 1')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  trader-data:
