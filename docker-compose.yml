services:
  bot:
    build: .
    container_name: tech-news-bot
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - bot_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data:
