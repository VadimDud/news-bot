services:
  bot:
    build: .
    container_name: tech-news-bot
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./dbdata:/app/dbdata
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('/app/dbdata/bot.db').execute('SELECT 1')"]
      interval: 30s
      timeout: 5s
      retries: 3
